name: Android interface build

on:
  workflow_dispatch:
  push:
    branches:
      - khiqwq-android-interface-styles

permissions:
  contents: read

jobs:
  android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: false

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Setup development signing
        env:
          DEV_KEYSTORE: ${{ secrets.DEV_KEYSTORE }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
        run: |
          echo "$DEV_KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$DEV_KEY_ALIAS"
            echo "storePassword=$DEV_STORE_PASSWORD"
            echo "keyPassword=$DEV_KEY_PASSWORD"
          } >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test Android appearance
        run: >-
          flutter test
          test/models/config_test.dart
          test/providers/config_test.dart
          test/l10n/app_localizations_test.dart
          test/l10n/localization_contract_test.dart
          test/common/migration_test.dart
          test/common/appearance_theme_test.dart
          test/common/navigator_test.dart
          test/pages/navigation_bar_appearance_test.dart
          test/pages/home_test.dart
          test/widgets/miuix_redesign_test.dart
          test/widgets/theme_settings_test.dart
          test/widgets/views_smoke_test.dart
          test/widgets/scaffold_back_test.dart
          test/android_predictive_back_test.dart
          test/liquid_glass_shader_test.dart
          test/android_dev_signing_test.dart
          --reporter expanded

      - name: Build release APK
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          DEV_BUILD: 'true'
        run: >-
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi

      - name: Verify release APK identity
        env:
          EXPECTED_PACKAGE: com.follow.clash.dev
          EXPECTED_CERT_SHA256: 6f301ced512a8d62d5d39182f3a2afa7b9ce95e4edc465637e1a1f61a9a20ac2
        run: |
          set -euo pipefail
          apk=$(find build/app/outputs/flutter-apk -name '*arm64-v8a*.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          package=$($build_tools/aapt2 dump packagename "$apk" | tr -d '\r')
          test "$package" = "$EXPECTED_PACKAGE"
          verify_output=$($build_tools/apksigner verify --verbose --print-certs "$apk")
          printf '%s\n' "$verify_output"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$verify_output"
          cert=$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' <<< "$verify_output" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$cert" = "$EXPECTED_CERT_SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: FlClash-Android-interface-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
